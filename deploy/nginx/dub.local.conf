# dub.local — short-link domain (public pages + link redirects)
#
# Setup (run once on NUC):
#   mkcert dub.local
#   sudo mv dub.local.pem     /opt/nginx/ssl/dub.local.pem
#   sudo mv dub.local-key.pem /opt/nginx/ssl/dub.local-key.pem
#   sudo cp deploy/nginx/dub.local.conf /opt/nginx/conf/conf.d/
#   docker exec nginx nginx -s reload

server {
    listen 80;
    server_name dub.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 off; # required — Next.js SSE/HMR breaks with http2

    server_name dub.local;

    ssl_certificate     /opt/nginx/ssl/dub.local.pem;
    ssl_certificate_key /opt/nginx/ssl/dub.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass         http://192.168.0.40:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
    }
}
